name: Monthly Audit Auto-Scheduler

on:
  # Runs at 9:00 AM EST on the 1st of every month (14:00 UTC)
  schedule:
    - cron: '0 14 1 * *'

  # Also allows manual trigger from the GitHub Actions tab
  workflow_dispatch:

jobs:
  auto-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @supabase/supabase-js resend

      - name: Run auto-scheduler
        run: node scripts/auto-schedule.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
